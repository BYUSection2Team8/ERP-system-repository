name: Database tests

# Applies every migration to a fresh Postgres and runs the SQL test scripts,
# so database changes are verified without anyone installing Postgres locally.
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/db-test.yml']
  pull_request:
    paths: ['supabase/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-throwaway
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only-throwaway
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v5

      - name: Stand-in for Supabase (roles, auth schema, realtime publication)
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/ci_supabase_stub.sql

      - name: Apply migrations in order
        run: |
          for f in supabase/migrations/*.sql; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Load starter seed data (run twice to prove it is safe to re-run)
        run: |
          for f in supabase/seed/*.sql; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Seed check (counts, rolled-up costs vs spec)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/seed_check.sql

      - name: Smoke test (every business function, numbers checked)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/smoke_core.sql

      - name: Row-level security test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_check.sql

      - name: Sales quote check (preview equals saved order, Phase 4)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/sales_quote_check.sql

      # The SQL Editor sends a whole paste as ONE batch, so test the paste files that way
      # on a second, empty database.
      - name: Paste files work as single batches (like the Supabase SQL Editor)
        run: |
          bash supabase/make_paste_files.sh
          psql -q -c "create database pastetest"
          export PGDATABASE=pastetest
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/ci_supabase_stub.sql
          # Paste 1 is over Linux's 128 KB limit for one command-line argument, so
          # read each file into a psql variable and send it with \gexec, which
          # still runs the whole file as ONE query string (simple protocol).
          for f in supabase/paste/1_setup_database.sql supabase/paste/2_run_checks.sql; do
            echo "== $f ($(wc -c < "$f") bytes)"
            printf '\\set paste `cat %s`\nselect :'"'"'paste'"'"' \\gexec\n' "$f" | psql -v ON_ERROR_STOP=1 -X
          done
