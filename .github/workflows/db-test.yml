name: Database tests

# Applies every migration to a fresh Postgres and runs the SQL test scripts,
# so database changes are verified without anyone installing Postgres locally.
# supabase/tests/run_sql.sh reports each result as an annotation (readable
# without signing in to GitHub), including the database error on failure.
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/db-test.yml']
  pull_request:
    paths: ['supabase/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-throwaway
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only-throwaway
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v5

      - name: Stand-in for Supabase (roles, auth schema, realtime publication)
        run: bash supabase/tests/run_sql.sh supabase/tests/ci_supabase_stub.sql -q

      - name: Apply migrations in order
        run: |
          for f in supabase/migrations/*.sql; do
            echo "== $f"
            bash supabase/tests/run_sql.sh "$f" -q || exit 1
          done

      - name: Load seed data (run twice to prove it is safe to re-run)
        run: |
          for f in supabase/seed/*.sql; do
            echo "== $f"
            bash supabase/tests/run_sql.sh "$f" -q || exit 1
            bash supabase/tests/run_sql.sh "$f" -q || exit 1
          done

      - name: Seed check (counts, rolled-up costs vs spec)
        run: bash supabase/tests/run_sql.sh supabase/tests/seed_check.sql

      - name: History check (60 customers, 6 months of derived history, Phase 6)
        run: bash supabase/tests/run_sql.sh supabase/tests/history_check.sql

      - name: Smoke test (every business function, numbers checked)
        run: bash supabase/tests/run_sql.sh supabase/tests/smoke_core.sql

      - name: Row-level security test
        run: bash supabase/tests/run_sql.sh supabase/tests/rls_check.sql

      - name: Sales quote check (preview equals saved order, Phase 4)
        run: bash supabase/tests/run_sql.sh supabase/tests/sales_quote_check.sql

      - name: Production + MRP check (Phase 5)
        run: bash supabase/tests/run_sql.sh supabase/tests/production_mrp_check.sql

      - name: Purchasing check (ROP, EOQ, scorecard, Phase 7)
        run: bash supabase/tests/run_sql.sh supabase/tests/purchasing_check.sql

      # The SQL Editor sends a whole paste as ONE batch, so test the paste files that way
      # on a second, empty database.
      - name: Paste files work as single batches (like the Supabase SQL Editor)
        run: |
          bash supabase/make_paste_files.sh
          psql -q -c "create database pastetest"
          export PGDATABASE=pastetest
          bash supabase/tests/run_sql.sh supabase/tests/ci_supabase_stub.sql -q || exit 1
          # Paste 1 is over Linux's 128 KB limit for one command-line argument, so
          # read each file into a psql variable and send it with \gexec, which
          # still runs the whole file as ONE query string (simple protocol).
          for f in supabase/paste/1_setup_database.sql supabase/paste/2_run_checks.sql; do
            echo "== $f ($(wc -c < "$f") bytes)"
            w="/tmp/$(basename "$f")"
            printf '\set paste `cat %s`\nselect :'"'"'paste'"'"' \gexec\n' "$f" > "$w"
            bash supabase/tests/run_sql.sh "$w" || exit 1
          done
