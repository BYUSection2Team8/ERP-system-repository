name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        # Errors are also reported as an annotation (readable without signing in).
        run: |
          if ! npm run typecheck -- --pretty false > tc.log 2>&1; then
            cat tc.log
            echo "::error title=Type check failed::$(grep -E 'error TS' tc.log | head -40 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          cat tc.log

      - name: Check Supabase secrets are set (values are never printed)
        run: |
          [ -n "$VITE_SUPABASE_URL" ] && echo "VITE_SUPABASE_URL: set" || echo "::warning::VITE_SUPABASE_URL is EMPTY - add it under Settings > Secrets and variables > Actions > Repository secrets"
          [ -n "$VITE_SUPABASE_ANON_KEY" ] && echo "VITE_SUPABASE_ANON_KEY: set" || echo "::warning::VITE_SUPABASE_ANON_KEY is EMPTY - add it under Settings > Secrets and variables > Actions > Repository secrets"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build
        run: |
          if ! npm run build > build.log 2>&1; then
            cat build.log
            echo "::error title=Build failed::$(tail -n 30 build.log | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          cat build.log
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
